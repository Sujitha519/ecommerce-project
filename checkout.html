<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - ShopCentral</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="logo"><a href="index.html"><i class="fa-solid fa-bag-shopping"></i> ShopCentral</a></div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="category.html">Categories</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
        <div class="nav-actions">
            <a href="search.html" class="icon-btn"><i class="fa-solid fa-magnifying-glass"></i></a>
            <a href="cart.html" class="icon-btn">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="badge" id="cart-count">0</span>
            </a>
        </div>
    </header>

    <section class="section" style="max-width: 800px; margin: 0 auto;">
        <h2 class="section-title">Shipping & Order Checkout</h2>
        <form id="checkout-form" style="background: white; padding: 2rem; border-radius: 8px;">
            <h3>Shipping Information</h3>
            <br>
            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" required placeholder="123 Main Street">
            </div>
            <div class="form-group">
                <label for="city">City</label>
                <input type="text" id="city" required placeholder="New York">
            </div>
            <div class="form-group">
                <label for="zip">Zip Code</label>
                <input type="text" id="zip" required placeholder="10001">
            </div>
            <br>
            <button type="submit" class="btn primary-btn" style="width: 100%;">Place Order</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 ShopCentral. Built for InternshipStudio Project.</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
