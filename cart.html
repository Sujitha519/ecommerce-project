<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - ShopCentral</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="logo"><a href="index.html"><i class="fa-solid fa-bag-shopping"></i> ShopCentral</a></div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="category.html">Categories</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
        <div class="nav-actions">
            <a href="search.html" class="icon-btn"><i class="fa-solid fa-magnifying-glass"></i></a>
            <a href="cart.html" class="icon-btn cart-badge-container">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="badge" id="cart-count">0</span>
            </a>
        </div>
    </header>

    <section class="section">
        <h2 class="section-title">Your Shopping Cart</h2>
        <div id="cart-content">
            <table class="cart-table">
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Total</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="cart-items">
                    <!-- Dynamic Cart Rows -->
                </tbody>
            </table>
            <div class="cart-summary">
                <h3>Grand Total: $<span id="grand-total">0.00</span></h3>
                <a href="checkout.html" class="btn primary-btn">Proceed to Checkout</a>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 ShopCentral. Built for InternshipStudio Project.</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
